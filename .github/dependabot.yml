version: 2
updates:

  - package-ecosystem: "vcpkg"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps(vcpkg)"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci"
    open-pull-requests-limit: 5

  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps(submodule)"
    open-pull-requests-limit: 3